<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>롤 성향 진단 결과</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; line-height: 1.7; margin: 0; padding: 20px 0; background-color: #f8f9fa; color: #212529; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { width: 90%; max-width: 800px; margin: 20px auto; background: #ffffff; padding: 25px 30px; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        h2, h3, h4 { text-align: center; color: #007bff; }
        h2 { font-size: 1.8em; margin-bottom: 20px; }
        h3 { font-size: 1.5em; margin-top: 30px; margin-bottom: 15px; border-bottom: 2px solid #007bff; padding-bottom: 8px; }
        h4 { font-size: 1.3em; color: #17a2b8; margin-top: 25px; margin-bottom: 10px; }

        .chart-container { position: relative; width: 90%; max-width: 450px; margin: 20px auto; padding: 15px; border: 1px solid #e0e0e0; border-radius: 8px; background-color: #fff; }

        #scoreDistributionText ul { list-style: none; padding: 0; text-align: center; }
        #scoreDistributionText li { font-size: 1.1em; margin-bottom: 5px; padding: 5px; background-color: #f1f3f5; border-radius: 4px; }
        #scoreDistributionText strong { color: #007bff; }

        .result-tendency, #additionalTraits, #championRecommendationDetails, #extraChampionSuggestions { margin-bottom: 25px; padding: 15px; background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; }
        .result-tendency .representative-image-container { text-align: center; margin-bottom: 15px; }
        .result-tendency .representative-image { max-width: 120px; border-radius: 50%; border: 3px solid #007bff; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .result-tendency h3, #additionalTraits h4, #championRecommendationDetails h4, #extraChampionSuggestions h4 { color: #0056b3; border-bottom-color: #0056b3; margin-top: 0; }
        .result-tendency p { text-align: justify; }
        .result-tendency .pros, .result-tendency .cons { font-weight: bold; }
        .result-tendency .pros { color: #28a745; }
        .result-tendency .cons { color: #dc3545; }

        #additionalTraits ul { list-style: none; padding-left: 0; }
        #additionalTraits li { background-color: #ffffff; margin-bottom: 10px; border-radius: 6px; border-left: 4px solid #17a2b8; }
        .trait-summary { padding: 12px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
        .trait-summary img.trait-icon { width: 32px; height: 32px; margin-right: 12px; border-radius: 4px; }
        .trait-summary strong { display: block; font-size: 1.1em; color: #17a2b8; margin-bottom: 0; flex-grow: 1; }
        .toggle-indicator { font-size: 0.9em; color: #007bff; margin-left: 10px; }
        .trait-detail { padding: 0 15px 15px 15px; border-top: 1px dashed #e0e0e0; margin-top: 10px; color: #333; line-height: 1.6; }

        #championRecommendationDetails p, #extraChampionSuggestions p { font-style: italic; color: #555; margin-bottom: 10px; }
        #championRecommendationDetails ul, #extraChampionSuggestions ul { list-style: none; padding-left: 0; display: flex; flex-wrap: wrap; gap: 8px; }
        #championRecommendationDetails li, #extraChampionSuggestions li { background-color: #e9ecef; padding: 6px 12px; border-radius: 15px; font-size: 0.95em; border: 1px solid #ced4da; }
        
        button#showMoreChampsBtn { background-color: #007bff; color: white; margin-top:15px; padding: 8px 15px; font-size:0.9em; }
        button#showMoreChampsBtn:hover { background-color: #0056b3; }

        .action-buttons { text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid #dee2e6; }
        .action-buttons button { display: inline-block; padding: 10px 18px; border: none; border-radius: 8px; font-size: 1em; cursor: pointer; margin: 5px; transition: background-color 0.2s, transform 0.1s; color: white; min-width: 120px; text-align: center; }
        .action-buttons button:hover { opacity: 0.9; }
        .action-buttons button:active { transform: scale(0.98); }
        .action-buttons button.restart-btn { background-color: #6c757d; }
        .action-buttons button.copy-result-btn { background-color: #17a2b8; }
        .action-buttons button.copy-link-btn { background-color: #ffc107; color: #212529; }
    </style>
</head>
<body>
    <div class="container">
        <h2>✨ 당신의 롤 성향 분석 결과 ✨</h2>

        <div class="chart-container">
            <canvas id="radarChart"></canvas>
        </div>

        <div id="scoreDistributionText">
            <h3>📊 포지션별 점수</h3>
            <ul></ul>
        </div>

        <div id="firstTendencyResult"></div>
        <div id="secondTendencyResult"></div>
        <div id="additionalTraits"></div>
        
        <div id="championRecommendationDetails" style="display:none;">
             <h4>🎯 맞춤 챔피언 추천</h4>
            <p id="championPlaystyle"></p>
            <ul id="championList"></ul>
            <div style="text-align:center; margin-top:15px;">
                 <button type="button" id="showMoreChampsBtn" onclick="toggleExtraChampionSuggestions()">더 많은 챔피언 보기</button>
            </div>
        </div>
        
        <div id="extraChampionSuggestions" style="display:none;">
            <h4>💡 추가 챔피언 제안</h4>
            <p>주요 성향 외에 이런 챔피언들은 어떠세요?</p>
            <div id="firstTendencyExtraChamps"></div>
            <div id="secondTendencyExtraChamps" style="margin-top:10px;"></div>
        </div>

        <div class="action-buttons">
            <button type="button" class="restart-btn" onclick="goBackToQuiz()">🔁 다시하기</button>
            <button type="button" class="copy-result-btn" onclick="copyResultsToClipboard()">📋 결과 텍스트 복사</button>
            <button type="button" class="copy-link-btn" onclick="copyPageLink()">🔗 퀴즈 링크 복사</button>
        </div>
    </div>

    <script>
        // 각 포지션별 상세 설명 및 대표 이미지 경로
        const positionDataStore = {
            "탑": { title: "탑 라이너 (Top Laner)", description: "당신은 듬직하고 인내심이 많은 타입으로써, 고통을 견뎌내는 힘이 강하고 주어진 목표를 달성하는 것을 즐깁니다. 독립적으로도 일을 잘 수행하며, 외로움을 잘 견딥니다. 주변으로부터 의지가 강하다는 얘기를 종종 듣습니다. 사소한 문제들에 때론 스트레스를 받기도 하지만 당신은 금방 마음을 다잡아 툭툭 털고 일어납니다. 다만, 때론 주변의 얘기를 듣지 않고 자신이 생각하는 데로 밀고나가는 고집스러움이 주변에 원망거리가 되기도 합니다. 자신의 목표를 달성하기 위해 주변의 생각과 감정을 무시하는 경향이 있습니다. 현실과 소환사의 협곡에서 모두 승리하기 위해 당신은 본인 외에 다른 사람들의 의견도 경청하는 습관이 들일 필요가 있습니다.", pros: "굳건함, 인내심, 목표 달성 능력, 독립성", cons: "고집불통, 이기심, 타인 의견 무시 경향", representativeImage: "img/top-rep.png", icon: "img/top-icon.png" },
            "정글": { title: "정글러 (Jungler)", description: "당신은 타인에게 도움을 주는 것을 좋아하며, 그것에 대한 인정을 받을 때 큰 기쁨을 느낍니다. 세부적인 내용을 챙기기보다는 큰 그림, 큰 판을 짜는 것을 즐기며 자신이 생각한 데로 일이 흘러갈 때 보람을 느낍니다. 새롭고 특별한 것을 좋아하며 주변 사람으로부터 창의적이다 라는 얘기를 종종 듣습니다. 때론 사람들이 몰라주는 것만 같아 속상하기도 하지만 당신은 굴하지 않고 다른 이에게 영향을 주는 것을 멈추지 않습니다. 다만, 인정에 대한 욕구가 강해서 누가 알아주지 않거나 무시할 경우 화를 내거나, 자신이 한 일에 대해 과한 생색으로 도움을 주고도 좋은 소리를 못 듣는 자충수를 두기도 합니다. 타인에게 특별하고 특이하게 인식되기 위해서하는 의외의 행동들은 사람들을 당혹스럽고 곤란하게 하기도 합니다. 현실과 소환사의 협곡에서 모두 승리하기 위해 당신은 보편적이고 일반적인 방법으로 팀과 합을 맞추는 연습이 필요합니다.", pros: "창의성 성향, 큰 그림 설계, 타인 도움 선호", cons: "생색충, 관종, 때론 엉뚱한 행동", representativeImage: "img/jungle-rep.png", icon: "img/jungle-icon.png" },
            "미드": { title: "미드 라이너 (Mid Laner)", description: "상황을 주도적으로 이끄는 것을 좋아하고, 어떤 일에 자신이 중심이나 주인공 역할을 맡게 되었을 때 동기부여되고 가장 힘을 얻는 타입입니다. 자신감이 넘치고 승부욕이 강하여 주어진 여건에서 최선을 다하며, 위기나 한계의 상황을 극복해 나가는 것을 즐깁니다. 주변으로부터 리더십이 있다고 인식되기도 합니다. ‘이 상황은 내가 해결해야 해!’ 라는 솔선수범의 자세가 때론 피곤하지만 당신은 팀의 승리와 당신의 명예를 위해 다시 일어섭니다. 다만, 목표를 달성하기 위해 너무 지시적이거나 잘난 체하는 모습을 보여 사람들에게 거부감을 느끼게 하기도 합니다. 자신이 최고라는 생각은 타인으로 하여금 거만한 느낌을 갖게 하며, 실력이 뒷받침 되지 못할 때 주변에 큰 실망을 안겨줍니다. 때론 당신의 지시가 응석처럼 느껴질 여지도 있습니다. 현실과 소환사의 협곡에서 모두 승리하기 위해 당신은 사람들의 의견을 잘 듣고 반영하며 겸손한 모습을 보이는 것이 필요합니다.", pros: "주도성 성향, 리더십, 자신감, 승부욕", cons: "지시적, 거만함, 때론 독선적", representativeImage: "img/mid-rep.png", icon: "img/mid-icon.png" },
            "원딜": { title: "원거리 딜러 (ADC)", description: "당신은 침착하고 냉철한 성격의 소유자로 상황을 빠르게 판단하여 가장 적절한 방법을 찾아내는 능력이 탁월합니다. 큰 부담감 앞에서도 끝까지 본인의 책임을 다하려는 당신의 모습은 주변으로부터 든든한 신뢰를 갖게 합니다. 정보와 방법이 명확하다면 당신은 빠르게 계획을 수립하고, 침착하고 차분히 한 단계씩 이뤄 나갈 수 있는 사람입니다. 위기 앞에서 움츠려 들 때도 있지만 부담을 이겨내는 것이 당신의 힘이라는 것을 스스로가 잘 알고 있습니다. 섬세하고 세밀한 당신의 집중력이 발휘되기 위해서는 불편한 변수들이 제거되어야만 하겠죠. 그래서인지, 자신의 뜻대로 풀리지 않을 때 예민해지는 경향이 있어 팀원들에게 짜증을 내거나 독설을 하기도 합니다. 이러한 감정기복이 있는 모습은 주변사람들에게 당신을 어려워하게 만드는 원인을 제공합니다. 현실과 소환사의 협곡에서 모두 승리하기 위해 당신은 일이 계획대로 되지 않거나 원하는 결과가 나오지 않을 때에도 여유로운 마음으로 주변을 대하는 것이 필요합니다.", pros: "냉철함, 판단력, 책임감, 계획성", cons: "예민보스, 짜증많음, 감정 기복", representativeImage: "img/adc-rep.png", icon: "img/adc-icon.png" },
            "서폿": { title: "서포터 (Support)", description: "당신은 타인을 위해 많은 에너지를 쏟는 타입으로 양보와 배려, 헌신의 아이콘으로 여겨집니다. 주변과의 좋은 관계를 위해 지속적으로 노력하고 중재자의 역할을 하며 편안한 분위기를 만들어 냅니다. 조화와 공존에 애를 쓰며 주변으로부터 착하다 배려심이 있다 라는 얘기를 종종 듣습니다. 타인의 마음이나 이익이 먼저 떠오르고 공감능력이 좋은 당신은 누가 알아주지 않더라도 자신이 스스로의 기준에 부합하는 모습이었다면 보람을 느낍니다. 분란이 일어나면 가장 스트레스를 받는 사람이기도 하면서 동시에 가장 훌륭한 조정자가 됩니다. 다만, 너무 수동적인 모습으로 주변으로 답답함을 유발하고, 주변을 챙기느라 정작 자신의 일을 잘 못 챙기는 일들이 생깁니다. 때로는 책임을 지고 당신이 이끌어야 할 때가 있음에도, 비난이나 부담이 두려워 안정적인 영역에서 벗어나지 못하기도 합니다. 자신만의 세계에 갇혀서 너무 많은 에너지를 소비하거나 빠르게 대처해야 하는 일들에 안정성을 생각하다가 타이밍을 놓치기 쉽습니다. 현실과 소환사의 협곡에서 모두 승리하기 위해 당신은 과감한 도전이나 주도적인 결정을 해나가는 시도가 필요합니다.", pros: "배려심, 공감능력, 중재자 역할", cons: "수동적, 때로는 자기 일 못 챙김, 과감한 도전 부족", representativeImage: "img/support-rep.png", icon: "img/support-icon.png" }
        };

        const championRecommendations = { /* 이전 답변의 최종 확정된 championRecommendations 객체 내용 */
            "탑-정글": { playstyle: "글로벌 영향력과 기동력을 활용한 타 라인 개입 및 스노우볼링", champions: ["카밀", "럼블", "쉔", "아트록스", "클레드"] },
            "탑-미드": { playstyle: "강력한 라인전 능력과 개인 피지컬을 바탕으로 한 캐리형 플레이", champions: ["레넥톤", "다리우스", "이렐리아", "잭스", "아트록스"] },
            "탑-서폿": { playstyle: "팀을 위해 헌신하는 든든한 탱커 또는 CC기반의 한타 기여", champions: ["오른", "마오카이", "말파이트", "사이온", "크산테"] },
            "탑-원딜": { playstyle: "강력한 1대1 능력을 바탕으로 한 스플릿 푸쉬 운영 또는 팀의 사이드 공격 옵션", champions: ["피오라", "카밀", "잭스", "제이스", "요릭"] },
            "정글-탑": { playstyle: "강력한 교전 능력과 성장력을 바탕으로 초중반 교전을 주도하고, 오브젝트 컨트롤과 함께 탑 라인과의 연계를 통해 스노우볼을 굴리는 전사형/성장형 정글", champions: ["리 신", "비에고", "자르반 4세", "신 짜오", "판테온"] },
            "정글-미드": { playstyle: "강력한 데미지 딜링을 바탕으로 한 암살 또는 누킹, 미드와의 연계를 통해 맵 중앙을 장악하고 빠르게 게임 템포를 올리는 플레이", champions: ["카직스", "이블린", "에코", "탈리야", "니달리"] },
            "정글-원딜": { playstyle: "자신의 성장을 중시하며 후반 캐리력을 도모하거나, 원거리에서 안정적으로 지속딜을 넣으며 변수를 창출하는 성장형/딜링형 정글", champions: ["킨드레드", "그레이브즈", "다이애나", "마스터 이", "카서스"] },
            "정글-서폿": { playstyle: "강력한 CC기나 아군 강화 능력으로 팀을 보조하고, 오브젝트 컨트롤과 시야 장악을 통해 팀 전체의 운영을 지원하는 버프형/CC형/탱커형 정글", champions: ["아이번", "누누와 윌럼프", "자크", "아무무", "세주아니"] },
            "미드-탑": { playstyle: "강력한 라인전 바탕의 스노우볼링, 사이드 운영 주도", champions: ["이렐리아", "아칼리", "요네", "제이스", "라이즈"] },

                            if (score >= 5) { title = "완벽을 추구하는 명사수 🏹"; comment = "당신은 한 치의 오차도 용납하지 않으려는 완벽주의적 성향의 명사수입니다. 극도의 집중력과 세밀한 계산을 통해 모든 변수를 통제하려 하며, 최상의 효율과 결과를 추구합니다. 때로는 지나치게 예민하거나 비판적인 모습을 보일 수 있지만, 이는 더 나은 결과를 위한 당신의 열정 때문입니다. 팀의 승리를 위해 엄청난 캐리력을 발휘하며, 불리한 상황에서도 흔들림 없는 정밀함으로 게임을 뒤집을 수 있는 잠재력을 가지고 있습니다. (주로 압도적인 피지컬과 극한의 집중력으로 게임을 지배하는 하이퍼 캐리형 원거리 딜러에 최적화)"; }
                            else if (score >= 3 && score <= 4) { title = "계산적인 명사수 📊"; comment = "당신은 뛰어난 판단력과 집중력을 바탕으로 합리적인 수를 계산하려는 전략가적 면모를 보입니다. 정보를 수집하고 분석하여 계획을 세우는 것을 선호하며, 감정보다는 논리에 따라 행동하려는 경향이 있습니다. 팀의 핵심 딜러로서 안정적으로 데미지를 공급하는 역할을 중요시하며, 영리한 포지셔닝으로 자신의 가치를 입증하려 합니다. (안정적인 성장과 지속적인 딜링을 중시하는 원거리 딜러 역할에 잘 맞을 수 있음)"; }
                            else { title = "아주 작은 신중함 🎯"; comment = "원거리 딜러의 침착함이 주된 모습은 아니지만, 간혹 신중하게 상황을 관찰하거나 안정적인 것을 선호하는 경향이 아주 약간 나타날 수 있습니다. 리스크를 크게 감수하기보다는 안전한 선택을 하려는 마음이 들 때가 있습니다. (원거리 딜러의 안정적 역할 수행에 대한 아주 미미한 가능성을 보임)"; }
                            break;
                        case "서폿":
                            if (score >= 5) { title = "승리의 설계자이자 어머니 🕊️"; comment = "당신은 팀 전체를 아우르는 넓은 시야와 뛰어난 상황 판단력을 가진, 팀의 보이지 않는 리더입니다. 모든 팀원을 세심하게 살피고 지원하며, 팀이 최상의 컨디션을 유지하도록 돕습니다. 때로는 과감한 이니시에이팅으로 한타를 열거나, 절묘한 스킬 활용으로 위기에 처한 아군을 구해냅니다. 당신의 존재 자체가 팀에게는 심리적인 안정감과 승리에 대한 믿음을 줍니다. 다만, 모든 것을 책임지려는 부담감에 짓눌리거나, 자신의 의견을 강하게 내세우지 못해 답답함을 유발할 수도 있습니다. (주로 맵 전체에 영향력을 행사하는 로밍형 서포터, 한타를 설계하는 이니시에이터, 또는 팀의 유지력을 극대화하는 유틸리티/힐러형 서포터에 최적화)"; }
                            else if (score >= 3 && score <= 4) { title = "믿음직한 지원가 🤝"; comment = "당신은 팀원들을 위해 기꺼이 헌신하려는 마음을 가진 믿음직한 지원가입니다. 좋은 공감 능력으로 팀원들의 필요를 파악하고, 이를 채워주려 노력합니다. 팀의 승리를 위해 궂은일도 마다하지 않으며, 때로는 결정적인 순간에 아군을 보호하여 팀에 기여합니다. 다만, 타인을 너무 챙기느라 자신을 돌보지 못하거나 다소 수동적인 모습을 보일 수 있으니, 가끔은 주도적인 판단도 필요합니다. (아군 보호나 CC기를 통한 지원에 능한 탱커형/유틸리티형 서포터 역할을 시도해볼 만함)"; }
                            else { title = "아주 작은 온기 ☀️"; comment = "타인을 돕는 서포터의 헌신이 강하게 드러나지는 않지만, 때때로 주변 사람을 배려하거나 팀의 조화를 생각하는 마음이 아주 조금 생길 수 있습니다. 누군가를 돕는 것에서 작은 보람을 느낄 가능성이 있습니다. (서포터의 지원 역할에 대한 아주 희미한 성향을 가짐)"; }
                            break;
                    }
                    traitsHtmlOutput += `<li><div class="trait-summary" onclick="toggleTraitDetail(this)"><img src="${positionIcon}" alt="${position} 아이콘" class="trait-icon"><strong>${position} (${score}점) - ${title}</strong><span class="toggle-indicator">▼ 더보기</span></div><div class="trait-detail" style="display:none;">${comment}</div></li>`;
                }
            });
            traitsHtmlOutput += "</ul>";
            additionalTraitsDiv.innerHTML = traitsHtmlOutput;

            // 5. 챔피언 추천 로직
            const championRecommendationDetailsDiv = document.getElementById('championRecommendationDetails');
            const championPlaystyleP = document.getElementById('championPlaystyle');
            const championListUl = document.getElementById('championList');
            championRecommendationDetailsDiv.style.display = 'none'; championListUl.innerHTML = ''; // 초기화
            if (firstTendency && secondTendency) {
                const firstPos = firstTendency[0]; const secondPos = secondTendency[0];
                const combinationKey = `${firstPos}-${secondPos}`;
                const recommendations = championRecommendations[combinationKey];
                if (recommendations) {
                    championPlaystyleP.textContent = `추천 플레이스타일: ${recommendations.playstyle}`;
                    recommendations.champions.forEach(champion => { const li = document.createElement('li'); li.textContent = champion; championListUl.appendChild(li); });
                    championRecommendationDetailsDiv.style.display = 'block';
                } else {
                    championPlaystyleP.textContent = `당신의 주 성향인 '${firstPos}'에 맞는 다양한 챔피언들을 탐색해보세요! (세컨드 성향 '${secondPos}'과의 조합 추천은 준비 중입니다.)`;
                    championRecommendationDetailsDiv.style.display = 'block';
                }
            } else if (firstTendency) {
                 championPlaystyleP.textContent = `당신은 '${firstTendency[0]}' 성향에 매우 특화되어 있군요! 이 포지션의 다양한 챔피언들을 플레이해보세요.`;
                 championRecommendationDetailsDiv.style.display = 'block';
            }
            
            // 6. 추가 챔피언 제안 표시 로직 (버튼 클릭 전에는 숨겨져 있음)
            displayExtraChampionSuggestions(firstTendency, secondTendency); // 내용은 채워두지만 extraChampionSuggestions div는 숨김

        }); // DOMContentLoaded 끝

        function toggleTraitDetail(summaryElement) { /* 이전과 동일 */
            const detailElement = summaryElement.nextElementSibling;
            const indicatorElement = summaryElement.querySelector('.toggle-indicator');
            if (detailElement.style.display === 'none' || detailElement.style.display === '') {
                detailElement.style.display = 'block';
                if(indicatorElement) indicatorElement.textContent = '▲ 숨기기';
            } else {
                detailElement.style.display = 'none';
                if(indicatorElement) indicatorElement.textContent = '▼ 더보기';
            }
        }

        function displayExtraChampionSuggestions(firstTendency, secondTendency) {
            const firstExtraChampsDiv = document.getElementById('firstTendencyExtraChamps');
            const secondExtraChampsDiv = document.getElementById('secondTendencyExtraChamps');
            firstExtraChampsDiv.innerHTML = ''; // 초기화
            secondExtraChampsDiv.innerHTML = ''; // 초기화

            if (firstTendency) {
                const firstPos = firstTendency[0];
                const champs = additionalSinglePositionChampions[firstPos];
                if (champs && champs.length > 0) {
                    let html = `<h5><img src="${positionDataStore[firstPos]?.icon || ''}" alt="${firstPos}" class="trait-icon" style="width:20px; height:20px; vertical-align:middle; margin-right:5px;"> ${positionDataStore[firstPos]?.title || firstPos} 성향 추가 추천:</h5><ul>`;
                    champs.forEach(champ => html += `<li>${champ}</li>`);
                    html += `</ul>`;
                    firstExtraChampsDiv.innerHTML = html;
                }
            }
            if (secondTendency) {
                const secondPos = secondTendency[0];
                const champs = additionalSinglePositionChampions[secondPos];
                 if (champs && champs.length > 0) {
                    let html = `<h5><img src="${positionDataStore[secondPos]?.icon || ''}" alt="${secondPos}" class="trait-icon" style="width:20px; height:20px; vertical-align:middle; margin-right:5px;"> ${positionDataStore[secondPos]?.title || secondPos} 성향 추가 추천:</h5><ul>`;
                    champs.forEach(champ => html += `<li>${champ}</li>`);
                    html += `</ul>`;
                    secondExtraChampsDiv.innerHTML = html;
                }
            }
        }
        
        function toggleExtraChampionSuggestions() {
            const extraDiv = document.getElementById('extraChampionSuggestions');
            const btn = document.getElementById('showMoreChampsBtn');
            if (extraDiv.style.display === 'none' || extraDiv.style.display === '') {
                extraDiv.style.display = 'block';
                btn.textContent = '추가 추천 숨기기';
                extraDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else {
                extraDiv.style.display = 'none';
                btn.textContent = '더 많은 챔피언 보기';
            }
        }

        function goBackToQuiz() { /* 이전과 동일 */ sessionStorage.removeItem('lolQuizScores'); window.location.href = "quiz.html"; }
        function copyResultsToClipboard() { /* 이전과 동일, 필요시 텍스트 구성에 추가된 내용 반영 */ 
            let textToCopy = "✨ 나의 롤 성향 진단 결과 ✨\n\n";
            textToCopy += `성향 분포: ${Object.entries(JSON.parse(sessionStorage.getItem('lolQuizScores'))).map(([pos, score]) => `${pos} ${score}점`).join(', ')}\n\n`;

            const firstResultTitle = document.querySelector('#firstTendencyResult h3');
            if (firstResultTitle) {
                textToCopy += `${firstResultTitle.textContent}\n`;
                document.querySelectorAll('#firstTendencyResult p').forEach(p => textToCopy += p.textContent + "\n");
                textToCopy += "\n";
            }

            const secondResultTitle = document.querySelector('#secondTendencyResult h3');
            if (secondResultTitle) {
                textToCopy += `${secondResultTitle.textContent}\n`;
                 document.querySelectorAll('#secondTendencyResult p').forEach(p => textToCopy += p.textContent + "\n");
                textToCopy += "\n";
            } else if (document.querySelector('#secondTendencyResult p')?.textContent.includes("뚜렷한 세컨드 성향은 나타나지 않았습니다")) {
                textToCopy += "세컨드 성향: 뚜렷한 세컨드 성향은 나타나지 않았습니다.\n\n";
            }
            
            textToCopy += "✨ 당신의 상세 성향 분석 ✨\n";
            document.querySelectorAll('#additionalTraits li').forEach(li => {
                const summaryDiv = li.querySelector('.trait-summary');
                const detailDiv = li.querySelector('.trait-detail');
                if (summaryDiv) { // 아이콘과 텍스트를 분리해서 가져오기
                     const iconImg = summaryDiv.querySelector('img.trait-icon');
                     const strongText = summaryDiv.querySelector('strong')?.textContent || "";
                     // textToCopy += (iconImg ? `[${iconImg.alt.replace(' 아이콘','')}] ` : "") + strongText + "\n";
                     textToCopy += strongText + "\n"; // 타이틀만 우선
                }
                // 상세 설명은 토글 상태와 관계없이 복사 (필요시 토글 상태 체크)
                if (detailDiv) textToCopy += detailDiv.textContent.trim() + "\n\n";
            });

            const champPlaystyle = document.getElementById('championPlaystyle').textContent;
            if(champPlaystyle && document.getElementById('championRecommendationDetails').style.display !== 'none') {
                 textToCopy += "🎯 " + champPlaystyle + "\n";
                 const champList = [];
                 document.querySelectorAll('#championList li').forEach(li => champList.push(li.textContent));
                 if (champList.length > 0) textToCopy += "추천 챔피언: " + champList.join(', ') + "\n\n";
            }
            
            const extraChampsDiv = document.getElementById('extraChampionSuggestions');
            if(extraChampsDiv.style.display !== 'none') {
                textToCopy += "💡 추가 챔피언 제안\n";
                const firstExtraTitle = document.querySelector('#firstTendencyExtraChamps h5');
                if(firstExtraTitle) textToCopy += firstExtraTitle.textContent + " " + Array.from(document.querySelectorAll('#firstTendencyExtraChamps li')).map(li => li.textContent).join(', ') + "\n";
                const secondExtraTitle = document.querySelector('#secondTendencyExtraChamps h5');
                if(secondExtraTitle) textToCopy += secondExtraTitle.textContent + " " + Array.from(document.querySelectorAll('#secondTendencyExtraChamps li')).map(li => li.textContent).join(', ') + "\n";
            }

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy.trim()).then(() => {
                    alert('진단 결과가 클립보드에 복사되었습니다!');
                }).catch(err => fallbackCopyTextToClipboard(textToCopy.trim()));
            } else {
                fallbackCopyTextToClipboard(textToCopy.trim());
            }
        }
        function fallbackCopyTextToClipboard(text) { /* 이전과 동일 */
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.top = "0"; textArea.style.left = "0"; textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus(); textArea.select();
            try {
                const successful = document.execCommand('copy');
                alert(successful ? '진단 결과가 클립보드에 복사되었습니다! (대체 방법)' : '결과 복사에 실패했습니다. (대체 방법)');
            } catch (err) {
                alert('결과 복사에 실패했습니다. 직접 복사해주세요. (대체 방법 오류)');
            }
            document.body.removeChild(textArea);
        }
        function copyPageLink() { /* 이전과 동일 */
            const quizUrl = window.location.href.replace('result.html', 'quiz.html');
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(quizUrl).then(() => {
                    alert('퀴즈 시작 페이지 링크가 복사되었습니다!');
                }).catch(err => fallbackCopyTextToClipboard(quizUrl));
            } else {
                fallbackCopyTextToClipboard(quizUrl);
            }
        }
    </script>
</body>
</html>
