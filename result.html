<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>롤 성향 진단 · 결과</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <div class="page">
    <div class="wrap">
      <div class="frame reveal">
        <p class="brand-kicker">Summoner's Rift · Result</p>
        <h1 class="title">당신의 <span class="accent">롤 성향</span> 결과</h1>
        <div class="divider"><span class="gem"></span></div>

        <div class="chart-box">
          <canvas id="radarChart"></canvas>
        </div>

        <h2 class="section-title">📊 포지션별 점수</h2>
        <ul class="score-badges" id="scoreBadges"></ul>

        <div id="firstTendency"></div>
        <div id="secondTendency"></div>

        <h2 class="section-title">🔍 상세 성향 분석</h2>
        <div class="traits" id="traits"></div>

        <div id="champMain" class="champ-box" style="display:none;">
          <h4>🎯 맞춤 챔피언 추천</h4>
          <p class="champ-playstyle" id="champPlaystyle"></p>
          <ul class="champ-list" id="champList"></ul>
          <div style="text-align:center; margin-top:18px;">
            <button type="button" class="btn btn-ghost" id="moreChampBtn" onclick="toggleExtra()">더 많은 챔피언 보기</button>
          </div>
        </div>

        <div id="champExtra" class="champ-box" style="display:none;">
          <h4>💡 추가 챔피언 제안</h4>
          <p class="champ-playstyle">주요 성향 외에 이런 챔피언들은 어떠세요?</p>
          <div id="extraFirst"></div>
          <div id="extraSecond" style="margin-top:14px;"></div>
        </div>

        <div class="actions">
          <button type="button" class="btn btn-primary" id="shareImgBtn" onclick="shareImage()">📸 결과 이미지 공유</button>
          <button type="button" class="btn btn-cyan" onclick="copyLink()">🔗 링크 복사</button>
          <button type="button" class="btn btn-ghost" onclick="restart()">🔁 다시하기</button>
        </div>

        <!-- 공유 카드 미리보기 (이미지 만든 뒤 표시) -->
        <div id="cardPreview" class="card-preview" style="display:none;">
          <p class="card-preview-hint">👇 이미지를 길게 눌러 저장하거나, 아래 버튼으로 공유하세요</p>
          <img id="cardPreviewImg" alt="롤 성향 진단 결과 카드">
          <div class="card-preview-actions">
            <a id="cardDownload" class="btn btn-primary" download="lol-diagnosis-result.png">💾 이미지 저장</a>
            <button type="button" class="btn btn-ghost" onclick="closeCardPreview()">닫기</button>
          </div>
        </div>

        <p class="foot">
          <span class="disclaimer">본 진단은 재미를 위한 콘텐츠이며, 실제 실력이나 성격을 규정하지 않습니다.</span>
        </p>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // 포지션 한글명 → 이미지 파일명
    const imgOf = { "탑":"top", "정글":"jungle", "미드":"mid", "원딜":"adc", "서폿":"support" };
    const IMG = p => `assets/img/${imgOf[p]}.png`;

    // ---- 성향 데이터 (원본 콘텐츠 유지) ----
    const positionDataStore = {
      "탑": {
        title: `탑 라이너 (Top Laner)`,
        mainDesc: `당신은 듬직하고 인내심이 많은 타입으로, 고통을 견뎌내는 힘이 강하고 주어진 목표를 달성하는 것을 즐깁니다. 독립적으로도 일을 잘 수행하며, 외로움을 잘 견딥니다. 주변으로부터 의지가 강하다는 얘기를 종종 듣습니다. 사소한 문제에 스트레스를 받기도 하지만, 당신은 금방 마음을 다잡아 툭툭 털고 일어납니다.`,
        cautionDesc: `다만, 때론 주변의 얘기를 듣지 않고 자신이 생각하는 대로 밀고 나가는 고집이 주변에 원망거리가 되기도 합니다. 목표를 달성하려 주변의 생각과 감정을 무시하는 경향이 있습니다. 현실과 협곡에서 모두 승리하려면, 다른 사람의 의견도 경청하는 습관이 필요합니다.`,
        pros: `굳건함, 인내심, 목표 달성 능력, 독립성`,
        cons: `고집불통, 이기심, 타인 의견 무시 경향`
      },
      "정글": {

        mainDesc: `당신은 타인에게 도움을 주는 것을 좋아하며, 그것에 대한 인정을 받을 때 큰 기쁨을 느낍니다. 세부적인 내용을 챙기기보다 큰 그림, 큰 판을 짜는 것을 즐기며, 자신이 생각한 대로 일이 흘러갈 때 보람을 느낍니다. 새롭고 특별한 것을 좋아하며 창의적이라는 얘기를 종종 듣습니다. 때론 사람들이 몰라주는 것 같아 속상하기도 하지만, 당신은 굴하지 않고 다른 이에게 영향을 주는 것을 멈추지 않습니다.`,
        cautionDesc: `다만, 인정 욕구가 강해서 누가 알아주지 않으면 화를 내거나, 과한 생색으로 도움을 주고도 좋은 소리를 못 듣는 자충수를 두기도 합니다. 특별하게 보이려는 의외의 행동이 사람들을 당혹스럽게 하기도 합니다. 현실과 협곡에서 모두 승리하려면, 보편적인 방법으로 팀과 합을 맞추는 연습이 필요합니다.`,
        pros: `창의성, 큰 그림 설계, 타인 도움 선호`,
        cons: `생색, 관종 기질, 때론 엉뚱한 행동`
      },
      "미드": {
        title: `미드 라이너 (Mid Laner)`,
        mainDesc: `상황을 주도적으로 이끄는 것을 좋아하고, 자신이 중심이나 주인공 역할을 맡을 때 가장 힘을 얻는 타입입니다. 자신감이 넘치고 승부욕이 강해 주어진 여건에서 최선을 다하며, 위기나 한계를 극복하는 것을 즐깁니다. 주변에서 리더십이 있다고 인식되기도 합니다. '이 상황은 내가 해결해야 해!'라는 솔선수범이 때론 피곤하지만, 당신은 팀의 승리와 자신의 명예를 위해 다시 일어섭니다.`,
        cautionDesc: `다만, 목표를 위해 너무 지시적이거나 잘난 체하는 모습이 사람들에게 거부감을 주기도 합니다. 자신이 최고라는 생각은 거만한 느낌을 주고, 실력이 뒷받침되지 못하면 큰 실망을 안겨줍니다. 현실과 협곡에서 모두 승리하려면, 사람들의 의견을 잘 듣고 반영하며 겸손한 모습을 보이는 것이 필요합니다.`,
        pros: `주도성, 리더십, 자신감, 승부욕`,
        cons: `지시적, 거만함, 때론 독선적`

        mainDesc: `당신은 침착하고 냉철한 성격으로, 상황을 빠르게 판단해 가장 적절한 방법을 찾아내는 능력이 탁월합니다. 큰 부담 앞에서도 끝까지 책임을 다하려는 모습은 주변에 든든한 신뢰를 줍니다. 정보와 방법이 명확하면 빠르게 계획을 세우고 차분히 한 단계씩 이뤄냅니다. 위기 앞에서 움츠러들 때도 있지만, 부담을 이겨내는 것이 자신의 힘이라는 걸 잘 알고 있습니다. 섬세한 집중력이 발휘되려면 불편한 변수가 제거되어야 하죠.`,
        cautionDesc: `그래서인지 뜻대로 풀리지 않을 때 예민해지는 경향이 있어, 팀원에게 짜증을 내거나 독설을 하기도 합니다. 이런 감정 기복은 주변 사람이 당신을 어려워하게 만듭니다. 현실과 협곡에서 모두 승리하려면, 계획대로 되지 않을 때도 여유로운 마음으로 주변을 대하는 것이 필요합니다.`,
        pros: `냉철함, 판단력, 책임감, 계획성`,
        cons: `예민함, 짜증, 감정 기복`
      },
      "서폿": {
        title: `서포터 (Support)`,
        mainDesc: `당신은 타인을 위해 많은 에너지를 쏟는 타입으로, 양보와 배려, 헌신의 아이콘으로 여겨집니다. 좋은 관계를 위해 꾸준히 노력하고 중재자 역할을 하며 편안한 분위기를 만들어냅니다. 조화와 공존에 애쓰며 착하다, 배려심 있다는 얘기를 종종 듣습니다. 타인의 마음이나 이익이 먼저 떠오르고 공감 능력이 좋아, 누가 알아주지 않아도 스스로 만족스러우면 보람을 느낍니다. 분란이 일어나면 가장 스트레스받는 사람이면서, 동시에 가장 훌륭한 조정자가 됩니다.`,
        cautionDesc: `다만, 너무 수동적인 모습으로 주변에 답답함을 유발하고, 주변을 챙기느라 정작 자신의 일을 못 챙기기도 합니다. 책임지고 이끌어야 할 때도 비난이나 부담이 두려워 안전한 영역에 머무르곤 합니다. 현실과 협곡에서 모두 승리하려면, 과감한 도전이나 주도적인 결정을 시도하는 것이 필요합니다.`,
        pros: `배려심, 공감 능력, 중재자 역할`,
        cons: `수동적, 자기 일 못 챙김, 도전 부족`
      }
    };

    const championRecommendations = {
      "탑-정글":{playstyle:`글로벌 영향력과 기동력을 활용한 타 라인 개입 및 스노우볼링`,champions:["카밀","쉔","아트록스","크산테","사이온"]},
      "탑-미드":{playstyle:`강력한 라인전 능력과 개인 피지컬을 바탕으로 한 캐리형 플레이`,champions:["레넥톤","다리우스","잭스","그웬","아트록스"]},
      "탑-서폿":{playstyle:`팀을 위해 헌신하는 든든한 탱커 또는 CC 기반의 한타 기여`,champions:["오른","말파이트","사이온","크산테","마오카이"]},
      "탑-원딜":{playstyle:`강력한 1대1 능력을 바탕으로 한 스플릿 푸쉬 운영 또는 사이드 공격 옵션`,champions:["피오라","카밀","잭스","나서스","요릭"]},
      "정글-탑":{playstyle:`강력한 교전 능력과 성장력으로 초중반 교전을 주도하고, 오브젝트 컨트롤과 탑 연계로 스노우볼을 굴리는 전사형/성장형 정글`,champions:["비에고","자르반 4세","신 짜오","판테온","리 신"]},
      "정글-미드":{playstyle:`강력한 딜링으로 암살 또는 누킹, 미드 연계로 맵 중앙을 장악하고 빠르게 템포를 올리는 플레이`,champions:["카직스","이블린","킨드레드","릴리아","니달리"]},
      "정글-원딜":{playstyle:`성장을 중시하며 후반 캐리력을 도모하거나, 원거리에서 안정적으로 지속딜을 넣는 성장형/딜링형 정글`,champions:["그레이브즈","킨드레드","릴리아","카서스","니달리"]},
      "정글-서폿":{playstyle:`강력한 CC나 아군 강화로 팀을 보조하고, 오브젝트 컨트롤과 시야 장악으로 운영을 지원하는 버프형/탱커형 정글`,champions:["자크","세주아니","라무스","마오카이","아무무"]},
      "미드-탑":{playstyle:`강력한 라인전 바탕의 스노우볼링, 사이드 운영 주도`,champions:["이렐리아","아칼리","요네","사일러스","제이스"]},
      "미드-정글":{playstyle:`맵 장악 및 오브젝트 컨트롤, 교전 유도`,champions:["탈리야","갈리오","아리","트위스티드 페이트","키아나"]},
      "미드-원딜":{playstyle:`강력한 후반 캐리, 안정적인 딜링 포지션`,champions:["아지르","오리아나","빅토르","신드라","카시오페아"]},
      "미드-서폿":{playstyle:`아군 지원 및 강화, 팀플레이 중심`,champions:["카르마","룰루","세라핀","갈리오","애니"]},
      "원딜-탑":{playstyle:`후반 캐리형, 안정적인 포지셔닝과 카이팅`,champions:["징크스","케이틀린","시비르","유나라","자야"]},
      "원딜-정글":{playstyle:`뛰어난 생존기나 변수 창출 능력을 바탕으로 공격적인 포지셔닝`,champions:["카이사","사미라","트위치","이즈리얼","루시안"]},
      "원딜-미드":{playstyle:`강력한 라인전 압박과 뛰어난 기동성으로 초중반 스노우볼`,champions:["루시안","케이틀린","트리스타나","드레이븐","코르키"]},
      "원딜-서폿":{playstyle:`강력한 유틸리티나 광역 CC로 한타에서 아군을 지원하거나 직접 판을 짜는 능력`,champions:["애쉬","바루스","진","미스 포츈","세나"]},
      "서폿-탑":{playstyle:`강력한 아군 보호와 탱킹으로 최전선에서 팀원을 지키거나, 뛰어난 CC로 한타를 여는 탱커형 서포터`,champions:["레오나","알리스타","브라움","렐","노틸러스"]},
      "서폿-정글":{playstyle:`아군에게 강력한 버프를 제공하거나, 뛰어난 기동성과 CC로 맵 전체에 영향력을 행사하는 유틸/로밍형 서포터`,champions:["라칸","바드","밀리오","잔나","파이크"]},
      "서폿-미드":{playstyle:`강력한 이니시에이팅이나 광역 CC로 한타를 설계하고 지배하는 플레이메이커형 서포터`,champions:["쓰레쉬","노틸러스","블리츠크랭크","레나타 글라스크","자이라"]},
      "서폿-원딜":{playstyle:`라인전에서 원거리 딜러를 강력히 보좌하며 압박하거나, 자신도 상당한 견제력으로 라인전을 리드하는 공격형 서포터`,champions:["룰루","밀리오","카르마","세나","럭스"]}
    };

    const additionalSinglePositionChampions = {
      "탑":["나서스","케넨","오른"],
      "정글":["자크","라무스","그라가스"],
      "미드":["아리","신드라","흐웨이"],
      "원딜":["케이틀린","징크스","유나라"],
      "서폿":["쓰레쉬","레오나","밀리오"]
    };

    let firstTendency = null, secondTendency = null;

    document.addEventListener('DOMContentLoaded', function () {
      const raw = sessionStorage.getItem('lolQuizScores') || null;
      if (!raw) { alert("진단 정보가 없습니다. 퀴즈를 먼저 진행해주세요!"); location.href = "quiz.html"; return; }
      const points = JSON.parse(raw);

      // 레이더 차트 (Chart.js 로드 실패해도 나머지 결과는 정상 렌더되도록 방어)
      const labels = Object.keys(points);
      try {
      const ctx = document.getElementById('radarChart');
      if (typeof Chart === 'undefined') throw new Error('Chart.js not loaded');
      new Chart(ctx.getContext('2d'), {
        type: 'radar',
        data: {
          labels: labels.map(l => `${l} (${points[l]})`),
          datasets: [{
            label: '나의 롤 성향', data: Object.values(points), fill: true,
            backgroundColor: 'rgba(200,170,110,0.22)', borderColor: '#c8aa6e',
            pointBackgroundColor: '#c8aa6e', pointBorderColor: '#010a13',
            pointHoverBackgroundColor: '#fff', pointHoverBorderColor: '#c8aa6e', borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          scales: { r: {
            angleLines: { color: 'rgba(200,170,110,0.25)' },

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
    }

    function copyText(text, msg) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => showToast(msg)).catch(() => fallbackCopy(text, msg));
      } else { fallbackCopy(text, msg); }
    }
    function fallbackCopy(text, msg) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.left = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      try { document.execCommand('copy'); showToast(msg); }
      catch (e) { showToast('복사에 실패했어요. 직접 복사해주세요.'); }
      document.body.removeChild(ta);
    }

    function loadImg(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const timer = setTimeout(() => reject(new Error('img timeout')), 6000);
        img.onload = () => { clearTimeout(timer); resolve(img); };
        img.onerror = () => { clearTimeout(timer); reject(new Error('img error')); };
        img.src = src;
      });
    }

          document.fonts.load('500 34px "Noto Sans KR"'),
          document.fonts.load('600 30px "Cinzel"')
        ]);
        await document.fonts.ready;
      } catch (e) { /* 실패해도 시스템 폰트로 진행 */ }
    }

    // 자동 줄바꿈 텍스트 ("A, B, C" → 쉼표 유지하며 폭 넘으면 줄바꿈)
    function wrapText(ctx, text, x, y, maxW, lineH) {
      const chunks = text.split(',').map(t => t.trim()).filter(Boolean);
      let line = '', yy = y;
      for (let i = 0; i < chunks.length; i++) {
        const piece = chunks[i] + (i < chunks.length - 1 ? ',' : '');
        const test = line ? line + ' ' + piece : piece;
        if (ctx.measureText(test).width > maxW && line) {
          ctx.fillText(line, x, yy);
          line = piece;
          yy += lineH;
        } else { line = test; }
      }
      if (line) ctx.fillText(line, x, yy);
      return yy;
    }

    // 정사각형 카드 그리기 → Blob 반환
    async function buildCard() {
      if (!firstTendency) return null;
      await ensureFonts();

      const S = 1080;                 // 인스타 표준 정사각형
      const canvas = document.createElement('canvas');
      canvas.width = S; canvas.height = S;
      const ctx = canvas.getContext('2d');

      // 1) 배경 (사이트와 동일한 딥블루 그라디언트)
      const bg = ctx.createLinearGradient(0, 0, 0, S);
      bg.addColorStop(0, '#0b1a2e');
      bg.addColorStop(0.5, '#0e2039');
      bg.addColorStop(1, '#081320');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, S, S);

      // 상단 골드 글로우
      const glow = ctx.createRadialGradient(S/2, 60, 40, S/2, 60, 620);
      glow.addColorStop(0, 'rgba(200,170,110,0.18)');
      glow.addColorStop(1, 'rgba(200,170,110,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, S, S);

      // 2) 헥스텍 그리드 패턴
      ctx.strokeStyle = 'rgba(200,170,110,0.06)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= S; i += 60) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, S); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(S, i); ctx.stroke();
      }

      // 3) 골드 프레임 + 모서리 장식
      const M = 42;
      ctx.strokeStyle = '#c8aa6e';
      ctx.lineWidth = 3;
      ctx.strokeRect(M, M, S - M * 2, S - M * 2);
      ctx.lineWidth = 6;
      const c = 60; // 모서리 길이
      const corners = [[M,M,1,1],[S-M,M,-1,1],[M,S-M,1,-1],[S-M,S-M,-1,-1]];
      corners.forEach(([x,y,dx,dy]) => {
        ctx.beginPath();
        ctx.moveTo(x, y + dy*c); ctx.lineTo(x, y); ctx.lineTo(x + dx*c, y);
        ctx.stroke();
      });

      // 4) 상단 라벨
      ctx.textAlign = 'center';
      ctx.fillStyle = '#c8aa6e';
      ctx.font = '600 30px Cinzel, "Noto Sans KR", serif';
      ctx.fillText('SUMMONER\u2019S  RIFT  ·  PERSONALITY  TEST', S/2, 130);

      ctx.fillStyle = '#f0e6d2';
      ctx.font = '900 52px "Noto Sans KR", sans-serif';
      ctx.fillText('나의 롤 성향은?', S/2, 200);

      // 구분선
      ctx.strokeStyle = '#785a28'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(S/2 - 150, 230); ctx.lineTo(S/2 - 20, 230); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(S/2 + 20, 230); ctx.lineTo(S/2 + 150, 230); ctx.stroke();
      ctx.fillStyle = '#c8aa6e';
      ctx.save(); ctx.translate(S/2, 230); ctx.rotate(Math.PI/4);
      ctx.fillRect(-6, -6, 12, 12); ctx.restore();

      // 5) 캐릭터 이미지 (원형)
      const pos = firstTendency[0];
      const cx = S/2, cy = 400, R = 130;
      try {
        const charImg = await loadImg(IMG(pos));
        ctx.save();
        // 배경 원(크림색)
        ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2);
        ctx.fillStyle = '#efe4cf'; ctx.fill();
        ctx.clip();
        ctx.drawImage(charImg, cx - R, cy - R, R*2, R*2);
        ctx.restore();
      } catch (e) { /* 이미지 실패해도 계속 */ }
      // 골드 테두리 링
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2);
      ctx.strokeStyle = '#c8aa6e'; ctx.lineWidth = 6; ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, R + 10, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(200,170,110,0.35)'; ctx.lineWidth = 2; ctx.stroke();

      // 6) 퍼스트 성향 제목
      const d = positionDataStore[pos];
      const title = d.title.split(' (')[0]; // 한글명만
      ctx.fillStyle = '#c8aa6e';
      ctx.font = '600 30px Cinzel, "Noto Sans KR", serif';
      ctx.fillText('🥇 나의 퍼스트 성향', S/2, 610);
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 68px "Noto Sans KR", sans-serif';
      ctx.fillText(title, S/2, 685);

      // 7) 세컨드 성향
      if (secondTendency) {
        const sTitle = positionDataStore[secondTendency[0]].title.split(' (')[0];
        ctx.fillStyle = '#9fb0c4';
        ctx.font = '500 34px "Noto Sans KR", sans-serif';
        ctx.fillText('🥈 세컨드 · ' + sTitle, S/2, 745);
      }

      // 8) 강점 키워드 박스
      const boxY = secondTendency ? 795 : 760;
      ctx.fillStyle = '#0ac8b9';
      ctx.font = '700 30px "Noto Sans KR", sans-serif';
      ctx.fillText('강점 키워드', S/2, boxY);
      ctx.fillStyle = '#f0e6d2';
      ctx.font = '500 34px "Noto Sans KR", sans-serif';
      wrapText(ctx, d.pros, S/2, boxY + 52, S - 220, 46);

      // 9) 하단 사이트 주소 (브랜딩)
      ctx.fillStyle = 'rgba(200,170,110,0.9)';
      ctx.font = '600 30px Cinzel, "Noto Sans KR", serif';
      ctx.fillText('acekaze.github.io/lol-diagnosis', S/2, S - 75);

      return await new Promise(res => canvas.toBlob(res, 'image/png'));
    }

    async function shareImage() {
      const btn = document.getElementById('shareImgBtn');
      btn.classList.add('loading');
      const original = btn.textContent;
      btn.textContent = '이미지 만드는 중…';

      try {
        if (!cachedBlob) {
          cachedBlob = await buildCard();
          if (!cachedBlob) { showToast('결과 정보가 없어요.'); return; }
          cachedUrl = URL.createObjectURL(cachedBlob);
        }

        const file = new File([cachedBlob], 'lol-diagnosis-result.png', { type: 'image/png' });
        const shareData = {
          title: '나의 롤 성향 진단 결과',
          text: '나의 롤 성향은? 너도 해봐! ' + SHARE_URL,
          files: [file]
        };

        // 모바일: 네이티브 공유 (카톡/인스타/문자 등)
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share(shareData);
        } else {
          // PC 등: 미리보기 + 저장 버튼 노출
          showPreview();
        }
      } catch (e) {
        // 공유 취소(AbortError)는 조용히 무시, 그 외엔 미리보기로 폴백
        if (e && e.name === 'AbortError') { /* 사용자가 취소함 */ }
        else { showPreview(); }
      } finally {
        btn.classList.remove('loading');
        btn.textContent = original;
      }
    }

    function showPreview() {
      if (!cachedUrl) return;
      document.getElementById('cardPreviewImg').src = cachedUrl;
      const dl = document.getElementById('cardDownload');
      dl.href = cachedUrl;
      const box = document.getElementById('cardPreview');
      box.style.display = 'block';
      box.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    function closeCardPreview() {
      document.getElementById('cardPreview').style.display = 'none';
    }
  </script>
</body>
